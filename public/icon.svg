    <!-- Storefront awning silhouette inside circle -->
    <path d="M214 206 L298 206 L292 242 C290 248 284 252 278 252 C272 252 267 248 266 242 L262 216 L250 216 L246 242 C245 248 240 252 234 252 C228 252 222 248 220 242 Z" fill="#FFFFFF"/>
    <rect x="222" y="252" width="68" height="24" rx="4" fill="#FFFFFF"/>
    <rect x="246" y="258" width="20" height="18" rx="2" fill="#EA580C"/>
