    <path d="M256 80 C170.9 80 102 148.9 102 234 C102 334 230 424 250 437 C253.6 439.4 258.4 439.4 262 437 C282 424 410 334 410 234 C410 148.9 341.1 80 256 80 Z" fill="#FFFFFF"/>
    
